<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- usee.sh 圆环（粗细:半径 = 10:40）置于黑卡式黑曜石底板，金色金属渐变 -->
  <defs>
    <linearGradient id="obsidian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1e22"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#f6e3a8"/>
      <stop offset="0.45" stop-color="#d6b26c"/>
      <stop offset="1" stop-color="#94702f"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#obsidian)"/>
  <rect x="1" y="1" width="98" height="98" rx="21" fill="none" stroke="#d6b26c" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#gold)" stroke-width="7.5"/>
</svg>
