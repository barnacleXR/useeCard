name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 浏览器管理回归
        run: |
          python3 -m pip install playwright==1.58.0
          python3 -m playwright install --with-deps chromium
          browser_data="$(mktemp -d)"
          DATABASE_PATH="$browser_data/db.sqlite" BACKUP_DIR="$browser_data/backups" BASE_URL=http://127.0.0.1:3098 CLIENT_DIST="$PWD/client/dist" COOKIE_SECURE=false PORT=3098 HOST=127.0.0.1 node server/dist/main.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$browser_data"' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3098/api/health >/dev/null && break || sleep 1; done
          USEECARD_BROWSER_URL=http://127.0.0.1:3098 python3 client/test/browser_smoke.py
      - name: 浏览器推送订阅回归
        run: |
          browser_data="$(mktemp -d)"
          DATABASE_PATH="$browser_data/db.sqlite" BACKUP_DIR="$browser_data/backups" BASE_URL=http://127.0.0.1:3099 CLIENT_DIST="$PWD/client/dist" COOKIE_SECURE=false PORT=3099 HOST=127.0.0.1 VAPID_PUBLIC_KEY=dGVzdA VAPID_PRIVATE_KEY=test-private-key VAPID_SUBJECT=mailto:test@example.com node server/dist/main.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$browser_data"' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3099/api/health >/dev/null && break || sleep 1; done
          USEECARD_BROWSER_URL=http://127.0.0.1:3099 python3 client/test/browser_smoke.py

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/useecard
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=useeCard
            org.opencontainers.image.description=Self-hosted credit card payment planner
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
