services:
  useecard:
    image: ghcr.io/barnaclexr/useecard:${USEECARD_VERSION:-latest}
    # 拉取不到镜像时（例如在源码目录中），从本地 Dockerfile 构建。
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${USEECARD_BIND:-127.0.0.1}:${USEECARD_PORT:-3090}:3000"
      - "127.0.0.1:${USEECARD_METRICS_PORT:-3091}:3001"
    environment:
      BASE_URL: ${BASE_URL:?请在 .env 中设置 BASE_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      APPRISE_API_URL: ${APPRISE_API_URL:-}
      APPRISE_API_USERNAME: ${APPRISE_API_USERNAME:-}
      APPRISE_API_PASSWORD: ${APPRISE_API_PASSWORD:-}
      CCM_API_RATE_LIMIT: ${CCM_API_RATE_LIMIT:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      AUDIT_TRUST_COUNTRY_HEADER: ${AUDIT_TRUST_COUNTRY_HEADER:-false}
      WEB_SESSION_IDLE_DAYS: ${WEB_SESSION_IDLE_DAYS:-30}
      METRICS_ENABLED: "true"
      METRICS_HOST: 0.0.0.0
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
    volumes:
      - useecard-data:/data
  apprise:
    image: caronc/apprise@sha256:0b2913b15c8eb47c25345722985ffbfae701326edde21909c205d296d62dd52c
    profiles: [notifications]
    restart: unless-stopped
    environment:
      APPRISE_STATEFUL_MODE: disabled
      APPRISE_WORKER_COUNT: 1
      APPRISE_ATTACH_SIZE: 0
      TZ: Asia/Tokyo
    # 只供同一 Compose 网络内的 useeCard 访问，不开放宿主机端口。
volumes:
  useecard-data:
